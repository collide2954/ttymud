# Port Ostra, the default city of TTYmud.
# The format is in docs/content.md.

[city port-ostra]
name = Port Ostra
start = relay
home = safehouse
burns = newsstand
contract = first-job

[host relay]
name = The Relay
desc = The public node at the heart of the city net. Every channel hisses with talk, ads, and old malware that nobody cleans up.
route = night-market
route = back-room
route = newsstand
route = safehouse

[host night-market]
name = The Night Market
desc = Stalls of cracked firmware and second-hand RAM, lit by dying screens. The prices change when you blink.
route = evidence-locker

[shop night-market]
program = scrub 300
program = patch 300
program = firewall 400
program = mask 400
program = pretext 400
program = proxy 500
ram = 12 900
ram = 16 1800
cpu = 5 1200
cpu = 6 2400

[host back-room]
name = The Back Room
desc = A bar behind a bar. Fixers sit in the dark corners and sell work to people who ask no questions.

[host newsstand]
name = The Newsstand
desc = A public feed of city news. The headlines scroll faster than anyone can read them, so nobody tries.

[host safehouse]
name = Your Safehouse
desc = A quiet node that the city forgot to index. Your rig hums under a stack of cold coffee cups.

[host evidence-locker]
name = The Evidence Locker
desc = A police node full of seized rigs. Each one has a tag, a case number, and a minimum bid.

# Bright Smile Dental, the target of the first contract.

[network smile-dental]
name = Bright Smile Dental

[host smile-gw]
name = Bright Smile Gateway
desc = A cheap VPN box behind a dental office on Kell Street. The login page still shows the default logo.
network = smile-dental
route = safehouse
route = front-desk
route = records

[host front-desk]
name = The Front Desk
desc = The workstation of the receptionist. Sticky notes cover the edge of the screen, and the calendar is full of root canals.
network = smile-dental
route = records

[host records]
name = The Records Server
desc = A beige tower in a closet, next to the mop bucket. It holds ten years of patient files.
network = smile-dental

[ice smile-gw/sentry]
type = sentry

[ice smile-gw/warden]
type = warden
guards = records

[ice front-desk/hound]
type = hound

[ice records/scorch]
type = scorch

[contract first-job]
fixer = Pell
network = smile-dental
goal = patients.db
pay = 250
offer = A dentist on Kell Street keeps ten years of patient files on one old box.
offer = A client wants them. Get patients.db and leave clean.
step = home: Your rig is in your safehouse. Type go safehouse.
step = enter: Connect to the dental office. Type go smile-gw.
step = scan: Type scan to find the ICE on this host.
step = probe: Type probe sentry to find its weak point.
step = crack: Type probe sentry | crack. The crack hits the weak point that the probe finds.
step = download: The file is on records. Go there, then type download patients.db.
step = scrub: Type scrub to delete your log lines and lower the trace.
step = exit: Go back the way you came in. Type back until you leave the network.

[file relay/motd.txt]
line = Welcome to Port Ostra.
line = The Cascade took the sky twenty years ago. The cables are all we have left.
line = Be polite on the Relay. The sysops read everything.

[file relay/rules.txt]
line = 1. No spam.
line = 2. No doxxing.
line = 3. What happens in the Back Room stays in the Back Room.

[file night-market/prices.db]
line = probe v1.0 ......... 150 cr
line = crack v1.0 ......... 200 cr
line = scrub v1.0 ......... 250 cr
line = 8 GB RAM, used ..... 400 cr

[file back-room/notice.txt]
line = Pell has one small job for new faces. Type contract to read it.
line = Bigger jobs come after the next patch.

[file newsstand/headlines.txt]
line = CASCADE DAY: twenty years without satellites.
line = Arcadia Bank reports record profits and a record number of breaches.
line = Kestrel Health denies the leak of 40,000 patient records.

[file safehouse/notes.txt]
line = A trace follows your path back. Keep the path short.
line = Never jack out above 75 percent.

[file front-desk/sticky-note.txt]
line = wifi: SmileBright2
line = vpn: same as the wifi lol

[file front-desk/schedule.txt]
line = 09:00  Mr. Okafor, cleaning
line = 10:30  Ms. Reyes, root canal
line = The night guard leaves at 22:00. Nobody watches the box after that.

[file records/patients.db]
line = 2,114 patient records: names, addresses, and insurance numbers.
line = The client pays well for this file.

[file evidence-locker/lot-17.txt]
line = Lot 17: a rig seized from the handle zer0day.
line = Minimum bid: 1,200 cr. Sold as seen. The last owner will not need it.
