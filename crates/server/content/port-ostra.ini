# Port Ostra, the default city of TTYmud.
# The format is in docs/content.md.

[city port-ostra]
name = Port Ostra
start = relay
home = safehouse

[host relay]
name = The Relay
desc = The public node at the heart of the city net. Every channel hisses with talk, ads, and old malware that nobody cleans up.
route = night-market
route = back-room
route = newsstand
route = safehouse

[host night-market]
name = The Night Market
desc = Stalls of cracked firmware and second-hand RAM, lit by dying screens. The prices change when you blink.
route = evidence-locker

[host back-room]
name = The Back Room
desc = A bar behind a bar. Fixers sit in the dark corners and sell work to people who ask no questions.

[host newsstand]
name = The Newsstand
desc = A public feed of city news. The headlines scroll faster than anyone can read them, so nobody tries.

[host safehouse]
name = Your Safehouse
desc = A quiet node that the city forgot to index. Your rig hums under a stack of cold coffee cups.

[host evidence-locker]
name = The Evidence Locker
desc = A police node full of seized rigs. Each one has a tag, a case number, and a minimum bid.

[file relay/motd.txt]
line = Welcome to Port Ostra.
line = The Cascade took the sky twenty years ago. The cables are all we have left.
line = Be polite on the Relay. The sysops read everything.

[file relay/rules.txt]
line = 1. No spam.
line = 2. No doxxing.
line = 3. What happens in the Back Room stays in the Back Room.

[file night-market/prices.db]
line = probe v1.0 ......... 150 cr
line = crack v1.0 ......... 200 cr
line = scrub v1.0 ......... 250 cr
line = 8 GB RAM, used ..... 400 cr

[file back-room/notice.txt]
line = No contracts tonight. Pell says to come back after the next patch.

[file newsstand/headlines.txt]
line = CASCADE DAY: twenty years without satellites.
line = Arcadia Bank reports record profits and a record number of breaches.
line = Kestrel Health denies the leak of 40,000 patient records.

[file safehouse/notes.txt]
line = A trace follows your path back. Keep the path short.
line = Never jack out above 75 percent.

[file evidence-locker/lot-17.txt]
line = Lot 17: a rig seized from the handle zer0day.
line = Minimum bid: 1,200 cr. Sold as seen. The last owner will not need it.
