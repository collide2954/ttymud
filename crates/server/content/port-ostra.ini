# Port Ostra, the default city of TTYmud.
# The format is in docs/content.md.

[city port-ostra]
name = Port Ostra
start = relay
home = safehouse
burns = newsstand
news = newsstand
auction = evidence-locker
contract = first-job

[channel ostra]
desc = All of Port Ostra. Talk about anything.
auto = yes

[channel help]
desc = Ask questions about the game. Other players answer.
auto = yes

[channel market]
desc = Buy, sell, and trade.

[host relay]
name = The Relay
desc = The public node at the heart of the city net. Every channel hisses with talk, ads, and old malware that nobody cleans up.
route = night-market
route = back-room
route = newsstand
route = safehouse

[host night-market]
name = The Night Market
desc = Stalls of cracked firmware and second-hand RAM, lit by dying screens. The prices change when you blink.
route = evidence-locker

[shop night-market]
program = scrub 300
program = patch 300
program = firewall 400
program = decoy 500
program = mask 400
program = pretext 400
program = proxy 500
program = exploit 800
blueprint = crack 600
blueprint = scrub 500
blueprint = patch 500
blueprint = mask 600
ram = 12 900
ram = 16 1800
cpu = 5 1200
cpu = 6 2400

[host back-room]
name = The Back Room
desc = A bar behind a bar. Fixers sit in the dark corners and sell work to people who ask no questions.

[host newsstand]
name = The Newsstand
desc = A public feed of city news. The headlines scroll faster than anyone can read them, so nobody tries.

[host safehouse]
name = Your Safehouse
desc = A quiet node that the city forgot to index. Your rig hums under a stack of cold coffee cups.

[host evidence-locker]
name = The Evidence Locker
desc = A police node full of seized rigs. Each one has a tag, a case number, and a minimum bid.

# Bright Smile Dental, the target of the first contract.

[network smile-dental]
name = Bright Smile Dental

[host smile-gw]
name = Bright Smile Gateway
desc = A cheap VPN box behind a dental office on Kell Street. The login page still shows the default logo.
network = smile-dental
route = safehouse
route = front-desk
route = records

[host front-desk]
name = The Front Desk
desc = The workstation of the receptionist. Sticky notes cover the edge of the screen, and the calendar is full of root canals.
network = smile-dental
route = records

[host records]
name = The Records Server
desc = A beige tower in a closet, next to the mop bucket. It holds ten years of patient files.
network = smile-dental

[ice smile-gw/sentry]
type = sentry

[ice smile-gw/warden]
type = warden
guards = records

[ice front-desk/hound]
type = hound

[ice records/scorch]
type = scorch

[contract first-job]
fixer = pell
network = smile-dental
goal = patients.db
pay = 250
offer = A dentist on Kell Street keeps ten years of patient files on one old box.
offer = A client wants them. Get patients.db and leave clean.
offer = After this job, come to the Back Room and type jobs for more work.
step = home: Your rig is in your safehouse. Type go safehouse.
step = enter: Connect to the dental office. Type go smile-gw.
step = scan: Type scan to find the ICE on this host.
step = probe: Type probe sentry to find its weak point.
step = crack: Type probe sentry | crack. The crack hits the weak point that the probe finds.
step = download: The file is on records. Go there, then type download patients.db.
step = scrub: Type scrub to delete your log lines and lower the trace.
step = exit: Go back the way you came in. Type back until you leave the network.

[file relay/motd.txt]
line = Welcome to Port Ostra.
line = The Cascade took the sky twenty years ago. The cables are all we have left.
line = Be polite on the Relay. The sysops read everything.

[file relay/rules.txt]
line = 1. No spam.
line = 2. No doxxing.
line = 3. What happens in the Back Room stays in the Back Room.

[file night-market/prices.db]
line = What the fence pays for stolen data:
line = A file from the LAN of a company ..... 40 cr and up
line = A file from the core of a company .... 100 cr and up
line = Big companies pay double, and the biggest pay eight times as much.
line = No receipts. No questions.

[file back-room/notice.txt]
line = Pell has one small job for new faces. Type contract to read it.
line = After that, Pell and Wren post new jobs each day. Type jobs to see them.
line = Each of them also posts a heist for a crew of 2 to 4 handles. Type crew to start a crew.

[file newsstand/headlines.txt]
line = CASCADE DAY: twenty years without satellites.
line = Arcadia Bank reports record profits and a record number of breaches.
line = Kestrel Health denies the leak of 40,000 patient records.

[file safehouse/notes.txt]
line = A trace follows your path back. Keep the path short.
line = Never jack out above 75 percent.

[file front-desk/sticky-note.txt]
line = wifi: SmileBright2
line = vpn: same as the wifi lol

[file front-desk/schedule.txt]
line = 09:00  Mr. Okafor, cleaning
line = 10:30  Ms. Reyes, root canal
line = The night guard leaves at 22:00. Nobody watches the box after that.

[file records/patients.db]
line = 2,114 patient records: names, addresses, and insurance numbers.
line = The client pays well for this file.

[file evidence-locker/notice.txt]
line = The police auction what they seize from burned handles: data, blueprints, hardware, and programs.
line = Type lots to see the lots. Type bid <lot> <credits> to bid. A first bid is 100 cr or more.
line = Each lot is open for 3 days. The top bid wins it. The police keep the credits.

# The fixers in the Back Room and the corporations that they send you after.

[fixer pell]
name = Pell
host = back-room
corp = mosaic
corp = kestrel
corp = orrery

[fixer wren]
name = Wren
host = back-room
max-heat = 3
corp = mosaic
corp = arcadia
corp = civic
corp = greyward

[corp mosaic]
name = Mosaic Media
budget = low
data = drafts.db: Next week of headlines, before the lawyers read them.
data = sources.db: The names behind every anonymous source.
data = ads.db: Ad deals with every big company in the city.
data = payroll.db: What each reporter earns.

[corp kestrel]
name = Kestrel Health
budget = medium
data = charts.db: Medical charts of forty thousand patients.
data = claims.db: Ten years of insurance claims.
data = trials.db: Results of a drug trial that never went public.
data = staff.db: Shifts and home addresses of every nurse.

[corp orrery]
name = Orrery Logistics
budget = medium
data = manifests.db: What really travels in each container.
data = berths.db: The schedule of every ship in the port.
data = customs.db: The customs officers who take bribes, and how much.
data = crews.db: Pay and papers for the dock workers.

[corp arcadia]
name = Arcadia Bank
budget = high
data = accounts.db: Balances of every private account.
data = loans.db: Every loan in default, and who owns the debt.
data = audit.db: An internal audit that the board buried.
data = transfers.db: Keys for the transfers between banks.

[corp civic]
name = Civic Grid
budget = high
data = substations.db: A map of every substation in the city.
data = meters.db: Power use for each home, hour by hour.
data = outages.db: Planned blackouts for the poor districts.
data = pumps.db: Control codes for the water pumps.

[corp greyward]
name = Greyward Defense
budget = top
data = council.db: Secret contracts with the city council.
data = serials.db: Serial numbers of every weapon that they sold.
data = agents.db: Names of their agents inside other companies.
data = patrols.db: Flight plans for the drone patrols.

# Host templates for the targets that the server makes.

[template vpn]
layer = edge
name = VPN Gateway
desc = The remote door for staff who work from home. It logs every login and reads none of the logs.
software = Gatehouse VPN 4

[template mail]
layer = edge
name = Mail Gateway
desc = All mail of the company passes through here, and so does a lot of spam.
software = Mailwright 3

[template www]
layer = edge
name = Web Server
desc = The public face of the company. Three of its plugins are out of date.
software = Spindle Web 2

[template ws]
layer = lan
name = Workstation
desc = A desk computer. A photo of a dog is the wallpaper.
software = Deskline OS 11

[template share]
layer = lan
name = File Share
desc = Shared folders for every team, with permissions that nobody has checked in years.
software = Ironside Server 8

[template printer]
layer = lan
name = Print Server
desc = It keeps a copy of every page that it prints. Nobody remembers that.
software = Inkwell Print 6

[template dev]
layer = lan
name = Dev Box
desc = A test machine for the developers. Everybody on it is an admin.
software = Deskline OS 11

[template db]
layer = core
name = Database Server
desc = The main database. Its fans run loud all day.
software = Ledgerbase 9

[template dc]
layer = core
name = Domain Controller
desc = It decides who can log in where. It is the crown of the network.
software = Ironside Server 8

[template backup]
layer = core
name = Backup Server
desc = Copies of everything, every night, on disks that nobody encrypts.
software = Vaultkeep 3

[template maint]
layer = lan
name = Maintenance Laptop
desc = The IT staff update the vault from it. Now and then it syncs with the vault by itself.
software = Deskline OS 11
laptop = yes

[template vault]
layer = vault
name = Cold Vault
desc = An air-gapped server in a locked room. It holds the secrets that the company cannot lose.

