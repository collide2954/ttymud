# The public list of TTYmud servers.
#
# The client has this list, and the website shows it. To add your server,
# change this file in a pull request. The operator guide tells how.
#
# [server <name>]       The name that players type: ttymud connect <name>.
# city = <city>         The name of the city on the server.
# address = <address>   The host name or the IP address, and the port.
# key = <key>           The line "Key:" from ttymud-server init.
# desc = <text>         One line about the server.
